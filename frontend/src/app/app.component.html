<a class="skip-link" href="#main-content">Skip to content</a>
<mat-sidenav-container class="shell">
  <mat-sidenav class="sidebar" [mode]="mobile() ? 'over' : 'side'" [opened]="menuOpen()" (closedStart)="menuOpen.set(false)" [fixedInViewport]="true" [autoFocus]="mobile()">
    <a class="brand" routerLink="/employees" aria-label="Salary management home"><span class="brand-mark"><app-icon name="grid" /></span><span>Salary<span class="brand-subtitle">PEOPLE & COMPENSATION</span></span></a>
    <div class="workspace-label">WORKSPACE</div>
    <nav aria-label="Main navigation">
      <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page" [attr.data-testid]="link.testId"><app-icon [name]="link.icon" /><span>{{link.label}}</span><app-icon class="nav-chevron" name="chevron" /></a>
    </nav>
    <div class="sidebar-footer"><div class="demo-symbol">AC</div><div><strong>ACME organization</strong><span>Synthetic demo data</span></div><span class="live-dot" aria-label="Demo workspace"></span></div>
  </mat-sidenav>
  <mat-sidenav-content>
    <header class="topbar">
      <div class="breadcrumb"><button mat-icon-button (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation" data-testid="toggle-navigation"><app-icon name="menu" /></button><span class="crumb-root">Workspace</span><app-icon class="crumb-separator" name="chevron" /><strong>{{pageName()}}</strong></div>
      <div class="topbar-profile"><app-status-badge tone="info">Demo workspace</app-status-badge><span class="avatar">HR</span><div class="profile-label"><strong>HR Manager</strong><span>Demo identity · unverified</span></div></div>
    </header>
    <main id="main-content" tabindex="-1"><router-outlet /></main>
    <footer class="page-footer">ACME · Salary management <span>Amounts stay in their local currency</span></footer>
  </mat-sidenav-content>
</mat-sidenav-container>
