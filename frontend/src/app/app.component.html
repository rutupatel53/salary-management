<a class="skip-link" href="#main-content">Skip to content</a>
<mat-sidenav-container class="shell">
  <mat-sidenav class="side-menu" mode="over" [opened]="menuOpen()" [autoFocus]="false" (closedStart)="menuOpen.set(false)">
    <div class="drawer-head">
      <span class="drawer-title">Workspace menu</span>
      <button mat-icon-button type="button" aria-label="Close navigation" data-testid="close-navigation" (click)="menuOpen.set(false)"><app-icon name="close" /></button>
    </div>
    <nav aria-label="Main navigation">
      <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page" [attr.data-testid]="link.testId">
        <app-icon [name]="link.icon" /><span>{{link.label}}</span>
      </a>
    </nav>
    <div class="drawer-footer"><strong>ACME organization</strong><span>Synthetic demo data</span></div>
  </mat-sidenav>
  <mat-sidenav-content>
    <header class="app-header">
      <div class="topbar">
        <div class="topbar-left">
          <button mat-icon-button type="button" (click)="toggleNavigation()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation" data-testid="toggle-navigation"><app-icon name="menu" /></button>
          <a class="brand" routerLink="/employees" aria-label="Salary management home">
            <span class="brand-mark"><app-icon name="grid" /></span>
            <span class="brand-copy"><strong>Salary</strong><span>PEOPLE &amp; COMPENSATION</span></span>
          </a>
        </div>
        <div class="topbar-right">
          <div class="profile-label"><strong>HR Manager</strong><span>Demo identity · unverified</span></div>
          <span class="avatar" aria-hidden="true">HR</span>
        </div>
      </div>
    </header>
    <main id="main-content" tabindex="-1"><router-outlet /></main>
    <footer class="page-footer">ACME · Salary management <span>Amounts stay in their local currency</span></footer>
  </mat-sidenav-content>
</mat-sidenav-container>
