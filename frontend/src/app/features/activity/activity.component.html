<section class="page-heading"><div><span class="eyebrow">CHANGE HISTORY</span><h1>Activity</h1><p>Recent employee, salary, import, and export actions.</p></div><button mat-button (click)="load()" data-testid="refresh-activity">Refresh</button></section>
<p *ngIf="loading" data-testid="activity-loading">Loading activity…</p><p class="error" role="alert" *ngIf="error">{{error}}</p>
<app-empty-state *ngIf="!loading&&!error&&!rows.length" title="No activity yet" message="Successful changes and file actions will appear here."></app-empty-state>
<div class="table-wrap" *ngIf="rows.length"><table data-testid="activity-table"><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Employee</th><th>Details</th></tr></thead><tbody><tr *ngFor="let row of rows" [attr.data-testid]="testId(row)"><td>{{row.occurredAt|date:'medium'}}</td><td>{{row.action.replace('_',' ')}}</td><td>{{row.actor}}</td><td>{{row.employeeId||'—'}}</td><td>{{detail(row)}}</td></tr></tbody></table><mat-paginator [length]="total" [pageIndex]="page" [pageSize]="size" [pageSizeOptions]="[10,25,50]" (page)="pageChange($event)" data-testid="activity-pagination"></mat-paginator></div>
