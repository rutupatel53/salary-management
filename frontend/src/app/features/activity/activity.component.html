<section class="page-heading"><div><span class="eyebrow">CHANGE HISTORY</span><h1>Activity</h1><p>Recent employee, salary, import, and export actions.</p></div><button mat-button (click)="load()" data-testid="refresh-activity">Refresh</button></section>
<app-loading-state *ngIf="loading" message="Loading activity…"></app-loading-state><app-error-state *ngIf="error" [message]="error"></app-error-state>
<app-empty-state *ngIf="!loading&&!error&&!rows.length" title="No activity yet" message="Successful changes and file actions will appear here."></app-empty-state>
<app-server-paged-table *ngIf="rows.length" [length]="total" [pageIndex]="page" [pageSize]="size" [pageSizeOptions]="[10,25,50]" (pageChange)="pageChange($event)"><table data-testid="activity-table"><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Employee</th><th>Details</th></tr></thead><tbody><tr *ngFor="let row of rows" [attr.data-testid]="testId(row)"><td>{{row.occurredAt|date:'medium'}}</td><td>{{row.action.replace('_',' ')}}</td><td>{{row.actor}}</td><td>{{row.employeeId||'—'}}</td><td>{{detail(row)}}</td></tr></tbody></table></app-server-paged-table>
