<app-dialog-shell [title]="model.id ? 'Edit salary template' : 'Create salary template'" eyebrow="SALARY SETUP" description="Define the rules once. Each employee gets their own CTC and dated salary snapshot.">
 <div *ngIf="error" class="error-banner" role="alert">{{error}}</div>
 <div class="template-details" (change)="dirty=true">
  <app-text-field label="Template name" [(ngModel)]="model.name" [maxLength]="100" testId="template-name" (ngModelChange)="dirty=true"></app-text-field>
  <app-dropdown label="Country and currency" [(ngModel)]="model.countryCode" testId="template-country" [options]="data.countries | dropdownOptions:'countryCode':'name':'currencyCode'" (ngModelChange)="dirty=true"></app-dropdown>
  <app-dropdown label="Status" [(ngModel)]="model.status" testId="template-status" [options]="[{value:'DRAFT',label:'Draft'},{value:'ACTIVE',label:'Active'},{value:'ARCHIVED',label:'Archived'}]" (ngModelChange)="dirty=true"></app-dropdown>
 </div>
 <div class="section-toolbar"><div><h3>Salary components</h3><p>Fixed values are annual. Keep one basic and one balancing allowance.</p></div><button mat-stroked-button [disabled]="model.components!.length>=20" (click)="add()" data-testid="add-template-component">Add component</button></div>
 <div class="component-list"><div class="component-editor" *ngFor="let row of model.components;let i=index" (change)="dirty=true">
  <app-text-field label="Component name" [(ngModel)]="row.name" [testId]="'component-name-'+i" (ngModelChange)="dirty=true"></app-text-field>
  <app-dropdown label="Category" [(ngModel)]="row.category" [options]="categoryOptions" [testId]="'component-category-'+i" (ngModelChange)="dirty=true"></app-dropdown>
  <app-dropdown label="Calculation" [(ngModel)]="row.calculation" (ngModelChange)="calculationChanged(row)" [options]="calculationOptions" [testId]="'component-calculation-'+i"></app-dropdown>
  <app-text-field label="Value" type="number" [min]="0" step="0.01" [(ngModel)]="row.value" [disabled]="row.calculation==='BALANCE'" [testId]="'component-value-'+i" (ngModelChange)="dirty=true"></app-text-field>
  <button mat-button type="button" (click)="remove(i)" [attr.aria-label]="'Remove '+row.name">Remove</button>
 </div></div>
 <p class="muted">Template edits apply to future assignments. Existing employee history stays unchanged.</p>
 <ng-container dialogActions><button mat-button [disabled]="saving" (click)="cancel()">Cancel</button><button mat-flat-button [disabled]="saving" (click)="save()" data-testid="save-template">{{saving?'Saving…':'Save template'}}</button></ng-container>
</app-dialog-shell>
