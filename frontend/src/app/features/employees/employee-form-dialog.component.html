<app-dialog-shell [title]="data.employee ? 'Edit employee' : 'Add employee'" description="Keep employee details accurate. All fields are required.">
  <div *ngIf="error" class="error" role="alert" data-testid="employee-form-error">{{ error }}</div>
  <form id="employee-editor" [formGroup]="form" (ngSubmit)="save()" data-testid="employee-form" class="fields">
    <app-text-field label="Employee number" type="text" formControlName="employeeNumber" testId="employee-form-number" errorMessage="Enter a valid employee number." [required]="true"></app-text-field>
    <app-text-field label="First name" type="text" formControlName="firstName" testId="employee-form-first-name" errorMessage="Enter a valid first name." [required]="true"></app-text-field>
    <app-text-field label="Last name" type="text" formControlName="lastName" testId="employee-form-last-name" errorMessage="Enter a valid last name." [required]="true"></app-text-field>
    <app-text-field label="Work email" type="email" formControlName="workEmail" testId="employee-form-email" errorMessage="Enter a valid work email." [required]="true"></app-text-field>
    <app-text-field label="Hire date" type="date" formControlName="hireDate" testId="employee-form-hire-date" errorMessage="Enter a valid hire date." [required]="true"></app-text-field>
    <app-dropdown label="Country" formControlName="countryCode" testId="employee-form-country" [options]="data.countries | dropdownOptions:'countryCode':'name':'currencyCode'" [required]="true" errorMessage="Enter a valid country."></app-dropdown>
    <app-dropdown label="Department" formControlName="departmentId" testId="employee-form-department" [options]="data.departments | dropdownOptions:'id':'name'" [required]="true" errorMessage="Enter a valid department."></app-dropdown>
    <app-text-field label="Job title" type="text" formControlName="jobTitle" testId="employee-form-title" errorMessage="Enter a valid job title." [required]="true"></app-text-field>
  </form>
  <ng-container dialogActions>
    <button mat-button type="button" [disabled]="saving || confirming" (click)="cancel()" data-testid="cancel-employee">Cancel</button>
    <button mat-flat-button color="primary" type="submit" form="employee-editor" [disabled]="saving" data-testid="save-employee">{{ saving ? 'Saving…' : 'Save employee' }}</button>
  </ng-container>
</app-dialog-shell>
