name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend unit tests
        run: mvn -B -f backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Angular unit tests
        working-directory: frontend
        run: npm test
      - name: Build Angular app
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: salary_management
          POSTGRES_USER: salary
          POSTGRES_PASSWORD: salary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salary -d salary_management"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Start API with seeded synthetic data
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/salary_management
          SPRING_DATASOURCE_USERNAME: salary
          SPRING_DATASOURCE_PASSWORD: salary
          APP_SEED_ENABLED: 'true'
          APP_TEST_TOOLS_ENABLED: 'true'
          PORT: '8080'
        run: |
          nohup mvn -q -f backend/pom.xml spring-boot:run > /tmp/salary-api.log 2>&1 &
          curl --fail --retry 90 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/api/health
          for attempt in $(seq 1 180); do
            total=$(curl -fsS 'http://127.0.0.1:8080/api/employees?q=ACME-&page=0&size=1' | jq -r '.totalItems' || echo 0)
            [ "$total" = "10000" ] && exit 0
            sleep 2
          done
          echo "Seed did not reach 10,000 employees"
          cat /tmp/salary-api.log
          exit 1
      - name: Start Angular UI
        working-directory: frontend
        run: |
          npm ci
          nohup npm run start -- --host 0.0.0.0 > /tmp/salary-ui.log 2>&1 &
          curl --fail --retry 90 --retry-delay 2 --retry-connrefused http://127.0.0.1:4200
      - name: Run sanity, functional, and data suites
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:4200
          API_URL: http://127.0.0.1:8080/api
          DB_URL: postgres://salary:salary@127.0.0.1:5432/salary_management
        run: npm run test:all
      - name: Capture 10,000-row query plans
        working-directory: e2e
        env:
          DB_URL: postgres://salary:salary@127.0.0.1:5432/salary_management
        run: npm run perf:check
      - name: Upload Playwright and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salary-management-test-reports
          path: e2e/reports/
          if-no-files-found: warn
