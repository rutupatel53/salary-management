[build]
base = "frontend"
command = "npm ci && npm run build"
publish = "dist/salary-management/browser"

[build.environment]
NODE_VERSION = "22.22.3"

[[redirects]]
from = "/api/*"
to = "https://salary-management-api.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
