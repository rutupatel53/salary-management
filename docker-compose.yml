services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
    ports:
      - "5432:5432"
    volumes:
      - salary_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10
  salary-api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/salary_management
      SPRING_DATASOURCE_USERNAME: salary
      SPRING_DATASOURCE_PASSWORD: salary
      APP_SEED_ENABLED: "true"
      APP_TEST_TOOLS_ENABLED: "true"
      FRONTEND_ORIGIN: "http://127.0.0.1:4200,http://localhost:4200"
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
  salary-ui:
    build: ./frontend
    depends_on:
      - salary-api
    ports:
      - "4200:80"
volumes:
  salary_postgres:
